<script>
  // Ganti dengan URL Web App Google Apps Script Anda
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz-Gwbs49S_W1sv_B_cAo2rd-mFKEeejNo9olYwc6Bw14FErqEwwzVPaSJwmxcXRBN2/exec";

  window.onload = function() {
    fetch(WEB_APP_URL + "?action=get_data")
      .then(response => response.json())
      .then(data => {
        handleDataSuccess(data);
      })
      .catch(err => {
        console.error("Gagal mengambil data:", err);
        document.getElementById("tableBody").innerHTML = 
          `<tr><td colspan="6" style="text-align:center; color:red; padding:20px;">Gagal memuat data dari server.</td></tr>`;
      });
  };
</script>
